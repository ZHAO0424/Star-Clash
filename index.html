<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星轨对决</title>
<link rel="icon" type="image/png" href="assets/ui/brand/app-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a0e1a;
    font: 14px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #dde4f0;
    user-select: none; -webkit-user-select: none; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .btn { font: inherit; font-size: 14px; padding: 9px 22px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(90,200,255,.45); background: rgba(90,200,255,.1); color: #cfe9ff; }
  .btn:hover { background: rgba(90,200,255,.22); }
  .btn.primary { background: rgba(90,200,255,.25); border-color: rgba(90,200,255,.8); font-weight: 600; }
  .btn:disabled { opacity: .35; cursor: default; }
  .muted-text { font-size: 12px; opacity: .55; }
  .err { color: #ff8a7a; font-size: 13px; min-height: 18px; }

  /* ── HUD ── */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #hud > * { pointer-events: auto; }
  #top-bar { position: absolute; top: 0; left: 0; right: 0; padding: 12px 18px;
    display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .base-row { display: flex; align-items: center; gap: 10px; width: min(560px, 86vw); }
  .base-row label { font-size: 12px; opacity: .7; white-space: nowrap; width: 64px; }
  .base-bar { flex: 1; height: 10px; background: #1a2236; border-radius: 5px; overflow: hidden; }
  .base-bar > div { height: 100%; border-radius: 5px; transition: width .3s; }
  #e-base { background: linear-gradient(90deg, #a53a3a, #ff6a5a); }
  #p-base { background: linear-gradient(90deg, #3a6ea5, #5ac8ff); }
  .base-row span { font-size: 12px; opacity: .8; width: 42px; text-align: right; }
  #vs-line { font-size: 12px; opacity: .45; letter-spacing: .1em; }
  #match-row { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  #timer { font-size: 20px; font-weight: 600; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  #timer.surge { color: #b49aff; } #timer.ot { color: #ff8a5a; }
  #phase-tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; display: none; }
  #phase-tag.surge { display: inline; background: rgba(122,90,255,.25); color: #c8b4ff; }
  #phase-tag.ot { display: inline; background: rgba(255,120,80,.25); color: #ffb49a; }
  .crowns { font-size: 13px; letter-spacing: .1em; }
  #end-reason { opacity: .65; font-size: 14px; }

  /* ── 底部:法力 + 手牌 ── */
  #bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0));
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    background: linear-gradient(transparent, rgba(8,11,20,.88) 35%); }
  #mana-row { display: flex; align-items: center; gap: 10px; width: min(480px, 80vw); }
  #mana-bar { flex: 1; height: 12px; background: #1a2236; border-radius: 6px; overflow: hidden; }
  #mana-fill { height: 100%; background: linear-gradient(90deg, #7a5aff, #5ac8ff); border-radius: 6px; }
  #mana-num { font-size: 13px; width: 48px; }
  #upgrade-progress { font-size: 11px; opacity: .5; }

  #hand { display: flex; gap: 8px; justify-content: center; }
  .card { width: 108px; min-height: 128px; padding: 8px; border-radius: 8px; cursor: grab; position: relative;
    background: linear-gradient(170deg, color-mix(in srgb, var(--fc) 22%, #141a2a), #10141f);
    border: 1px solid color-mix(in srgb, var(--fc) 55%, transparent);
    transition: transform .12s; touch-action: none; }
  .card:hover { transform: translateY(-6px); }
  .card.disabled { opacity: .38; cursor: default; }
  .card.disabled:hover { transform: none; }
  .card .cost { position: absolute; top: -7px; left: -7px; width: 26px; height: 26px; border-radius: 50%;
    background: #7a5aff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .card .cname { font-size: 13px; font-weight: 600; margin: 4px 0 4px 14px; color: var(--fc); }
  .card .stats { display: flex; gap: 6px; margin-bottom: 4px; }
  .card .stat { font-size: 11px; background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 4px; }
  .card .spell-tag { background: color-mix(in srgb, var(--fc) 30%, transparent); }
  .card .art { display: block; width: 100%; height: 58px; object-fit: contain; margin: 2px 0 2px; pointer-events: none; }
  .card .art.glow { mix-blend-mode: screen; }   /* 黑底发光图标:滤色混合去掉黑底 */
  .card .tags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
  .card .tag { font-size: 9px; padding: 0 4px; border-radius: 3px; line-height: 15px;
    background: rgba(255,210,74,.14); color: #ffd24a; border: 1px solid rgba(255,210,74,.25); }
  .card .cdesc { font-size: 10px; opacity: .55; line-height: 1.4; }
  .card .discard { position: absolute; top: 3px; right: 4px; width: 18px; height: 18px; border-radius: 50%;
    font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: rgba(255,255,255,.08); color: rgba(221,228,240,.55); }
  .card .discard:hover { background: rgba(255,90,74,.35); color: #fff; }
  .card.disabled .discard { pointer-events: auto; }

  #drag-ghost { position: fixed; display: none; transform: translate(-50%, -120%); pointer-events: none;
    background: rgba(90,200,255,.18); border: 1px solid rgba(90,200,255,.6); color: #cfe9ff;
    padding: 6px 14px; border-radius: 6px; font-size: 13px; z-index: 50; backdrop-filter: blur(4px); }

  #drag-ghost[data-invalid="true"] { background: #40212c; border-color: #ff786f; color: #ffe7df; }
  #core-status { color: #ffdb99; font-size: 12px; white-space: nowrap; }

  /* ── 强化 / 结束 覆盖层 ── */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 24px; background: rgba(6,9,16,.82); backdrop-filter: blur(6px); z-index: 30; }
  .overlay h2 { font-size: 24px; letter-spacing: .2em; font-weight: 500; }
  #upgrade-list { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .upgrade-card { width: 170px; padding: 20px 16px; border: 1px solid rgba(122,90,255,.5); border-radius: 10px;
    cursor: pointer; background: rgba(122,90,255,.08); transition: transform .15s, background .15s; }
  .upgrade-card:hover { transform: translateY(-4px); background: rgba(122,90,255,.2); }
  .upgrade-card h3 { color: #b49aff; font-size: 16px; margin-bottom: 8px; }
  #compare-page { position: fixed; inset: 0; z-index: 60; overflow-y: auto; padding: 18px 24px 40px; background: #0a0e1a; color: #dde4f0; }
  #compare-page h2 { margin-bottom: 4px; }
  .compare-row { margin-top: 18px; }
  .compare-row h3 { font-size: 15px; margin-bottom: 6px; }
  .compare-row .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .compare-row img, .compare-row .ph { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: #141a2a; }
  .compare-row .ph { display: flex; align-items: center; justify-content: center; text-align: center; opacity: .5; font-size: 13px; }
  @media (max-width: 700px) { .compare-row .pair { grid-template-columns: 1fr; } }
  /* 混沌血祭:法力不够但可以用核心生命补的牌 */
  .card.blood { border-color: #ff4a5a; box-shadow: 0 0 10px rgba(255,60,80,.45); }
  .card.blood .cost { background: #c0283c; }
  .card .blood-tag { position: absolute; top: -8px; right: 18px; padding: 0 5px; border-radius: 8px; font-size: 11px; font-weight: 700;
    background: #c0283c; color: #fff; }
  .upgrade-card .up-icon { display: block; width: 72px; height: 72px; margin: 0 auto 8px; }
  /* 界面小图标(处理脚本已把黑底转成透明) */
  .ico { height: 1.15em; width: auto; vertical-align: -0.22em; }
  #mana-icon .ico { height: 20px; vertical-align: middle; }
  .card .discard .ico { height: 12px; vertical-align: 0; }
  #end-badge { width: 160px; height: 160px; margin-bottom: -10px; }
  .upgrade-card p { font-size: 12px; opacity: .7; }
  .overlay button { font: inherit; padding: 10px 28px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(90,200,255,.5); background: rgba(90,200,255,.12); color: #cfe9ff; }
  .overlay button:hover { background: rgba(90,200,255,.25); }

  #toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 40;
    background: rgba(16,22,36,.92); border: 1px solid rgba(122,90,255,.4); padding: 8px 18px;
    border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; }

  #next-card { font-size: 11px; opacity: .6; }
  #net-status { position: absolute; top: 12px; left: 14px; font-size: 11px; opacity: .6; }
  #btn-menu { position: absolute; top: 46px; right: 14px; font: inherit; font-size: 12px;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(90,200,255,.35); background: rgba(16,22,36,.7); color: #9fc8e8; }
  #btn-mute { position: fixed; bottom: 14px; right: 14px; z-index: 40; font-size: 16px; width: 34px; height: 34px;
    border-radius: 50%; cursor: pointer; border: 1px solid rgba(90,200,255,.35); background: rgba(16,22,36,.8); color: #cfe9ff; }
  #btn-xr { position: absolute; top: 12px; right: 14px; font: inherit; font-size: 12px;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(90,200,255,.35); background: rgba(16,22,36,.7); color: #9fc8e8; }

  /* ── 响应式:放在最后,覆盖上面的基础样式 ── */
  /* 一般高度的屏幕:卡牌只留名字、立绘和数值,描述和关键词改成悬停时浮在卡牌上方,给战场多留空间 */
  @media (max-height: 820px) {
    #hand .card { min-height: 0; }
    #hand .card .art { height: 46px; }
    #hand .card .info { display: none; position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
      width: 190px; padding: 8px 10px; border-radius: 8px; z-index: 5; pointer-events: none;
      background: #10141f; border: 1px solid color-mix(in srgb, var(--fc) 55%, transparent); box-shadow: 0 6px 18px rgba(0,0,0,.6); }
    #hand .card .info .cdesc { opacity: .8; font-size: 11px; }
    #hand .card:hover .info { display: block; }
  }
  /* 矮屏(手机横屏等):紧凑卡牌和顶栏,给战场留出空间 */
  @media (max-height: 560px) {
    #top-bar { padding: 6px 12px; gap: 2px; }
    #vs-line { display: none; }
    .base-row label, .base-row span { font-size: 10px; }
    #bottom { padding-top: 4px; gap: 4px; }
    #hand { gap: 6px; }
    .card { width: 84px; min-height: 0; padding: 6px; }
    .card .art { height: 36px; }
    .card .cname { font-size: 11px; }
  }
  /* 矮的横屏(手机横放):战场是竖长的,左右两侧本来就空 → 顶栏挪到左列、手牌挪到右列,战场用满整个高度 */
  @media (max-height: 560px) and (min-aspect-ratio: 4/3) {
    #top-bar { right: auto; bottom: 0; width: 180px; padding: 10px; justify-content: flex-start;
      background: linear-gradient(90deg, rgba(8,11,20,.85) 70%, transparent); }
    .base-row { width: 100%; }
    .base-row label { width: 48px; }
    #net-status { top: auto; bottom: 92px; left: 10px; }
    #btn-xr { top: auto; bottom: 52px; left: 10px; right: auto; }
    #btn-menu { top: auto; bottom: 14px; left: 10px; right: auto; }
    #bottom { top: 0; left: auto; width: 208px; padding: 8px 8px 8px 16px; justify-content: center;
      background: linear-gradient(270deg, rgba(8,11,20,.88) 75%, transparent); }
    #mana-row { width: 100%; flex-wrap: wrap; gap: 4px 8px; }
    #next-card, #upgrade-progress { font-size: 10px; }
    #hand { flex-wrap: wrap; }
    .card { width: 88px; }
    #btn-mute { bottom: 128px; right: auto; left: 10px; }
  }
  /* 竖屏手机:卡牌变窄、去掉描述,顶栏右边给 XR / 退出按钮让位 */
  @media (max-width: 620px) and (min-height: 561px) {
    .card { width: 66px; min-height: 0; padding: 6px 5px; }
    .card .stats { flex-wrap: wrap; gap: 2px; }
    .card .tags, .card .cdesc { display: none; }
    .card .art { height: 40px; }
    .card .cname { font-size: 11px; margin-left: 12px; }
    #top-bar { align-items: flex-start; padding-right: 96px; }
    .base-row { width: 100%; }
    .base-row label { width: 54px; }
    #mana-row { width: 92vw; flex-wrap: wrap; gap: 2px 8px; }
  }

</style>
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="assets/fonts/noto-sans-sc-900.css">
<link rel="stylesheet" href="menu.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="front-loading" class="menu-screen sub" role="status"><span class="front-loading-text" data-i18n="loading">加载中…</span></div>

<!-- 主页:居中对称,字标在上、菜单在下 -->
<div id="home-screen" class="menu-screen" style="display:none">
  <main class="home">
    <h1 class="home-logo" id="home-title" tabindex="-1"><img class="brand-wordmark" alt="" hidden><span data-i18n="title">星轨对决</span></h1>
    <nav class="home-menu">
      <button class="g-btn g-gold" id="btn-start" type="button" data-i18n="startGame">开始游戏</button>
      <button class="g-btn g-teal" id="btn-home-online" type="button" data-i18n="onlineGame">联机游戏</button>
      <div class="minor-row">
        <button class="g-btn g-ink" id="btn-codex" type="button" disabled data-i18n="codex">图鉴</button>
        <button class="g-btn g-ink" id="btn-settings" type="button" data-i18n="settings">设置</button>
        <button class="g-btn g-ink" id="btn-home-xr" type="button" aria-describedby="xr-availability">XR</button>
      </div>
    </nav>
    <span id="xr-availability" class="sr-only" role="status"></span>
  </main>
  <div class="home-tools"><button class="g-btn g-ink round-btn sound-toggle" type="button"></button></div>
</div>

<!-- 对局设置(人机 / 联机共用一屏,模式由主页入口决定) -->
<div id="setup-screen" class="menu-screen sub" style="display:none">
  <div class="page">
    <header class="topbar">
      <div><button class="g-btn g-ink g-back" id="btn-setup-back" type="button">‹ <span data-i18n="back">返回</span></button></div>
      <h1 id="setup-title" tabindex="-1"></h1>
      <div class="right"><button class="g-btn g-ink round-btn sound-toggle" type="button"></button></div>
    </header>
    <div class="setup">
      <div class="setup-col">
        <section class="frame slot" aria-labelledby="side-title">
          <h2 class="over" id="side-title" data-i18n="yourSide">我方</h2>
          <div class="factions" id="faction-list"></div>
          <div class="passive" id="faction-passive"><b id="faction-passive-name"></b><p id="faction-passive-desc"></p></div>
          <div class="deckline"><span id="deck-summary"></span><button class="g-btn g-ink g-sm" id="btn-edit-deck" type="button" disabled data-i18n="editDeck">编辑卡组</button></div>
        </section>
        <section class="frame slot" aria-labelledby="opp-title">
          <h2 class="over" id="opp-title"></h2>
          <div class="diffs" id="difficulty">
            <button class="choice diff" type="button" data-v="basic"><span class="name" data-i18n="easy">简单</span></button>
            <button class="choice diff" type="button" data-v="normal"><span class="name" data-i18n="normal">普通</span></button>
            <button class="choice diff" type="button" data-v="smart"><span class="name" data-i18n="hard">困难</span></button>
          </div>
          <div class="online-form" id="online-form" hidden>
            <label class="field"><span data-i18n="nickname">昵称</span><input class="input" id="player-name" maxlength="16" placeholder="留空则随机命名" data-i18n-ph="guestPlaceholder"></label>
            <div class="field"><label for="join-code" data-i18n="roomCode">房号</label>
              <div class="join"><input class="input code" id="join-code" maxlength="4" placeholder="ABCD" autocomplete="off"><button class="g-btn g-teal g-sm" id="btn-join" type="button" disabled data-i18n="join">加入</button></div>
            </div>
            <section id="online-state" class="room-state" hidden>
              <div id="room-wait" hidden>
                <div id="room-identity"></div>
                <div id="room-code"></div>
                <button class="g-btn g-ink g-sm" id="btn-copy-room" type="button" data-i18n="copyRoom">复制房号</button>
              </div>
              <div class="room-progress"><span id="online-progress" role="status"></span><button class="g-btn g-ink g-sm" id="btn-cancel-connection" type="button" hidden data-i18n="cancelConnection">取消连接</button></div>
            </section>
            <div class="err" id="online-err" role="alert"></div>
          </div>
        </section>
      </div>
      <div class="setup-col">
        <section class="frame map" aria-labelledby="map-title">
          <h2 class="over" id="map-title" data-i18n="battlefield">战场</h2>
          <div class="preview" aria-live="polite"><img id="arena-img" alt=""><div class="cap"><h3 id="arena-name"></h3><p id="arena-description"></p></div></div>
          <div class="maps" id="scene-list"></div>
        </section>
        <section class="frame board" id="leaderboard-panel" hidden aria-labelledby="board-title">
          <h2 class="over" id="board-title" data-i18n="leaderboard">排行榜</h2>
          <div id="leaderboard"></div>
        </section>
      </div>
    </div>
  </div>
  <div class="actionbar"><button class="g-btn g-gold g-go" id="btn-fight" type="button" disabled></button></div>
</div>

<!-- 图鉴(含组卡):左卡牌网格,右详情 + 出战卡组 -->
<div id="codex-screen" class="menu-screen sub" style="display:none">
  <div class="page">
    <header class="topbar">
      <div><button class="g-btn g-ink g-back" id="btn-codex-back" type="button">‹ <span data-i18n="back">返回</span></button></div>
      <h1 id="codex-title" tabindex="-1" data-i18n="codex">图鉴</h1>
      <div class="right"><button class="g-btn g-ink round-btn sound-toggle" type="button"></button></div>
    </header>
    <div class="tabs" id="codex-tabs"></div>
    <div class="codex">
      <section class="frame pool-wrap"><div class="pool" id="codex-grid"></div></section>
      <aside class="side">
        <section class="frame detail" id="codex-detail" aria-live="polite"></section>
        <section class="frame roster" aria-labelledby="roster-title">
          <h2 class="over" id="roster-title" data-i18n="deckRoster">出战卡组</h2>
          <div class="slots" id="deck-slots"></div>
          <div class="deckstat"><span><span data-i18n="deckCards">卡牌</span><b id="deck-count"></b></span><span><span data-i18n="deckAvg">均费</span><b id="deck-avg"></b></span></div>
          <div class="err" id="deck-err" role="status"></div>
        </section>
      </aside>
    </div>
  </div>
  <div class="actionbar">
    <button class="g-btn g-ink g-sm" id="btn-deck-preset" type="button" data-i18n="presetDeck">推荐卡组</button>
    <button class="g-btn g-gold g-go" id="btn-deck-save" type="button" data-i18n="saveBack">保存</button>
  </div>
</div>

<!-- 设置:分组,每项一行 -->
<div id="settings-screen" class="menu-screen sub" style="display:none">
  <div class="page">
    <header class="topbar">
      <div><button class="g-btn g-ink g-back" id="btn-settings-back" type="button">‹ <span data-i18n="back">返回</span></button></div>
      <h1 id="settings-title" tabindex="-1" data-i18n="settings">设置</h1>
      <div class="right"></div>
    </header>
    <div class="settings frame">
      <div class="group"><h2 class="over" data-i18n="groupDisplay">显示</h2>
        <div class="row-set"><b id="lbl-language" data-i18n="language">语言</b><div class="seg" id="settings-language" role="group" aria-labelledby="lbl-language"><button type="button" data-v="zh">中文</button><button type="button" data-v="en">English</button></div></div>
      </div>
      <div class="group"><h2 class="over" data-i18n="groupSound">声音</h2>
        <div class="row-set"><b id="lbl-sound" data-i18n="xrSound">音效</b><div class="seg" id="settings-sound" role="group" aria-labelledby="lbl-sound"><button type="button" data-v="on" data-i18n="xrOn">开</button><button type="button" data-v="off" data-i18n="xrOff">关</button></div></div>
      </div>
      <div class="group"><h2 class="over">XR</h2>
        <div class="row-set"><b id="lbl-size" data-i18n="xrBoardSize">战场尺寸</b><div class="seg" id="settings-size" role="group" aria-labelledby="lbl-size"><button type="button" data-v="small" data-i18n="xrBoard_small">小</button><button type="button" data-v="standard" data-i18n="xrBoard_standard">中</button><button type="button" data-v="large" data-i18n="xrBoard_large">大</button></div></div>
        <div class="row-set"><b id="lbl-xr-mode" data-i18n="xrMode">XR 模式</b><div class="seg" id="settings-xr-mode" role="group" aria-labelledby="lbl-xr-mode"><button type="button" data-v="auto" data-i18n="xrAuto">自动</button><button type="button" data-v="immersive-vr" data-i18n="xrImmersiveVR">沉浸 VR</button><button type="button" data-v="immersive-ar" data-i18n="xrImmersiveAR">透视 AR</button></div></div>
        <div class="row-set"><b data-i18n="xrGuideRow">XR 操作教学</b><button class="g-btn g-ink g-sm" id="btn-xr-guide" type="button" data-i18n="view">查看</button></div>
      </div>
    </div>
  </div>
</div>
<dialog id="xr-guide" class="guide-dialog" aria-labelledby="guide-title">
  <header><h2 id="guide-title" data-i18n="xrGuide">XR 操作</h2><button class="btn" id="btn-guide-close" data-i18n="close">关闭</button></header>
  <figure>
    <img id="guide-art" alt="">
    <figcaption><strong id="guide-step"></strong><p id="guide-description"></p></figcaption>
  </figure>
  <footer>
    <button class="btn" id="btn-guide-prev" data-i18n="guidePrev">上一步</button>
    <span id="guide-progress" role="status"></span>
    <button class="btn primary" id="btn-guide-next" data-i18n="guideNext">下一步</button>
  </footer>
</dialog>

<!-- 战斗 HUD -->
<div id="hud" style="display:none">
  <div id="top-bar">
    <div class="base-row player-base"><span class="base-label" data-i18n="myBase">我方核心</span><strong id="p-base-num">1000</strong><div class="base-bar"><div id="p-base" style="width:100%"></div></div></div>
    <div id="match-row">
      <span id="timer">4:00</span>
      <span class="crowns" id="crowns-p" style="color:#7cc4ff">♛ 0</span>
      <span class="crowns" id="crowns-e" style="color:#ff8a7a">0 ♛</span>
    </div>
    <div class="base-row enemy-base"><span class="base-label" data-i18n="enemyBase">敌方核心</span><strong id="e-base-num">1000</strong><div class="base-bar"><div id="e-base" style="width:100%"></div></div></div>
    <span id="phase-tag"></span>
    <p id="vs-line" class="sr-only"></p>
  </div>
  <button id="btn-xr" data-i18n="enterXR">进入 XR</button>
  <button id="btn-menu" data-i18n="quit">退出对局</button>
  <div id="net-status"></div>
  <section id="first-match-guide" hidden aria-labelledby="first-match-title">
    <div><strong id="first-match-title"></strong><p id="first-match-text" aria-live="polite"></p></div>
    <div class="first-match-actions">
      <button class="btn" id="btn-first-match-skip" type="button" data-i18n="firstMatchSkip">跳过引导</button>
      <button class="btn primary" id="btn-first-match-go" type="button" hidden data-i18n="firstMatchGo">开战</button>
    </div>
  </section>
  <div id="bottom">
    <div id="mana-row">
      <span id="mana-icon"></span>
      <div id="mana-bar"><div id="mana-fill"></div></div>
      <span id="mana-num">5/10</span>
      <span id="upgrade-progress"></span>
    </div>
    <div id="hand-row"><div id="next-card"></div><div id="hand"></div></div>
    <span id="core-status" hidden></span>
    <div id="play-hint">
      <span id="play-instruction" role="status"></span><span id="play-card-detail" hidden></span>
      <button type="button" id="btn-cancel-card" hidden data-i18n="cancel">取消</button>
    </div>
  </div>
</div>

<div id="drag-ghost"></div>
<div id="placement-error" role="status" hidden></div>
<button id="btn-mute" title="音效开关" data-i18n-title="muteTip">🔊</button>
<button id="pause-badge" type="button" hidden></button>
<div id="prep-countdown" hidden aria-live="assertive"></div>
<div id="toast" role="status" aria-atomic="true"></div>

<!-- 强化选择 -->
<div id="upgrade-screen" role="dialog" aria-modal="true" aria-labelledby="upgrade-title" class="overlay" style="display:none">
  <h2 id="upgrade-title" data-i18n="upgradeTitle">强化阶段</h2>
  <div class="sub" style="opacity:.6" data-i18n="upgradeSub">三选一 · 对手同步强化</div>
  <div class="upgrade-countdown"><span id="upgrade-time"></span><progress id="upgrade-timer"></progress><small data-i18n="upgradeTimeout">超时自动选择</small></div>
  <div id="upgrade-list"></div>
  <div class="muted-text" id="upgrade-wait" role="status" tabindex="-1"></div>
</div>

<!-- 结束 -->
<div id="end-screen" role="dialog" aria-modal="true" aria-labelledby="end-title" class="overlay" style="display:none">
  <img id="end-badge" alt="" hidden>
  <h2 id="end-title"></h2>
  <div id="end-reason"></div>
  <dl id="match-summary">
    <div><dt data-i18n="matchScore">比分</dt><dd id="end-score"></dd></div>
    <div><dt data-i18n="matchCores">核心（我/敌）</dt><dd id="end-cores"></dd></div>
    <div><dt data-i18n="matchTime">用时</dt><dd id="end-duration"></dd></div>
  </dl>
  <div class="muted-text" id="end-stats"></div>
  <div class="row"><button class="btn primary" id="btn-again">再来一局</button><button class="btn" id="btn-restart" data-i18n="backMenu">返回主页</button></div>
</div>

<script>window.BG_STATIC = location.hostname.endsWith('.github.io'); window.BG_ONLINE_URL = "https://star-clash.onrender.com";</script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
