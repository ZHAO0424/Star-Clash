<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对手头像预览</title>
<style>html,body{margin:0;height:100%;background:#2a2238;overflow:hidden;font:13px sans-serif;color:#eee}#info{position:fixed;left:10px;top:8px}</style>
</head>
<body>
<div id="info">联机对手头像预览(模拟姿态,拖动旋转 / 滚轮缩放)· 用法:node server/server.mjs 后打开 /tools/avatar-preview.html</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const { XROpponentAvatar } = await import('../js/xr-avatar.js?v=' + Date.now());   // 预览页:每次都拿最新代码

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2238);
scene.add(new THREE.HemisphereLight(0xffffff, 0x443355, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(1, 2, 1.5); scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 50);
camera.position.set(0, 0.25, 1.1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.0, -0.15);
controls.update();
// 桌面(参考):坐标里 y=0 约是台面上方,对手坐在 z>0 一侧
const table = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.02, 0.9), new THREE.MeshStandardMaterial({ color: 0x6b5a48 }));
table.position.set(0, -0.36, 0.2); scene.add(table);

const avatar = new XROpponentAvatar();
scene.add(avatar.root);
avatar.root.rotation.y = Math.PI;   // 和游戏里一样:对手坐在桌子对面,整体转 180°
const qy = a => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), a);
const qx = a => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), a);
const pack = (p, q, g) => [...p, ...q.toArray(), g];
// 和联机里一样的座位坐标(net.xrPartInSeat 的范围):头 z≈0.38、手 z≈0;root 转 180° 后对手在 -z 一侧、面朝 +z(看向玩家)
const pose = t => [
  pack([Math.sin(t * 0.6) * 0.08, 0.30 + Math.sin(t * 1.3) * 0.02, 0.38], qy(Math.sin(t * 0.6) * 0.35).multiply(qx(-0.35)), 0),
  pack([-0.22 + Math.sin(t * 1.1) * 0.05, -0.12 + Math.sin(t * 1.7) * 0.05, 0.05 + Math.cos(t * 1.1) * 0.08], qx(-0.3), 0),
  pack([0.18 + Math.sin(t * 0.9) * 0.12, -0.10 + Math.abs(Math.sin(t * 2)) * 0.06, -0.05 + Math.sin(t * 0.9) * 0.15], qx(-0.5), Math.sin(t * 2) > 0.3 ? 1 : 0),
];
window.__freeze = null;   // 截图用:设成秒数冻结在那一刻
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = window.__freeze ?? clock.elapsedTime;
  avatar.update(pose(t), dt);
  renderer.render(scene, camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__cam = (x, y, z, tx = 0, ty = 0, tz = -0.15) => { camera.position.set(x, y, z); controls.target.set(tx, ty, tz); controls.update(); };
window.__avatar = avatar;
</script>
</body>
</html>
